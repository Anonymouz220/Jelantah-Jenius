<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Creative Hub</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav>
    <div class="navbar">
      <div class="logo"><a href="index.html">Creative Hub</a></div>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="aboutme.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="menu-btn"><i class="fas fa-bars"></i></div>
      <div class="cancel-btn"><i class="fas fa-times"></i></div>
    </div>
  </nav>

  <section class="contact" id="contact">
    <div class="content">
      <div class="title"><span>Get In Touch</span></div>
      <div class="text">
        <p>Have a question or a project in mind? Reach out to us!</p>
        <p>Email: contact@creativehub.com</p>
      </div>
      <form action="#" class="contact-form">
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <textarea placeholder="Tell us about your project..." required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <div class="scroll-button">
    <a href="#contact"><i class="fas fa-arrow-up"></i></a>
  </div>

  <script src="script.js"></script>
</body>
</html>
