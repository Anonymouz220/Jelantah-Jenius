<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Jelantah Jenius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav>
    <div class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="attached_assets/JELANTAH_JENIUS_png_2_1767949499577.png" alt="Jelantah Jenius Logo" style="height: 40px; vertical-align: middle;">
          Jelantah Jenius
        </a>
      </div>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
      <div class="menu-btn"><i class="fas fa-bars"></i></div>
      <div class="cancel-btn"><i class="fas fa-times"></i></div>
    </div>
  </nav>

  <section class="contact" id="contact">
    <div class="content">
      <div class="title"><span>Contact Us</span></div>
      <div class="text">
        <p>Join us in transforming used cooking oil into a blessing!</p>
        <p>Email: contact@jelantahjenius.org</p>
      </div>
      <form action="#" class="contact-form">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email Address" required />
        <textarea placeholder="How would you like to contribute or what would you like to ask?" required></textarea>
        <button type="submit">Submit Inquiry</button>
      </form>
    </div>
  </section>

  <script src="script.js"></script>
