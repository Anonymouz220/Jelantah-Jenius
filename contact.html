<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Jelantah Jenius</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="attached_assets/JJ%20Logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="attached_assets/JJ%20Logo.png" />
  <link rel="canonical" href="https://jelantahjenius.com/contact" />
</head>
<body>
  <nav id="navbar">
    <div class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="attached_assets/JELANTAH_JENIUS_png_2_1767949499577.png" alt="Logo">
          Jelantah Jenius
        </a>
      </div>
      <ul class="menu">
        <div class="cancel-btn"><i class="fas fa-times"></i></div>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About Us</a></li>
        <li><a href="/articles">Articles</a></li>
        <li><a href="/programs">Programs</a></li>
        <li><a href="/contact" class="active">Contact Us</a></li>
      </ul>
      <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <section class="contact">
    <div class="content">
      <div class="contact-wrapper">
        <div class="contact-info">
          <h3>Let's Make a Change</h3>
          <p style="color: rgba(255,255,255,0.8);">Ready to contribute to a cleaner, more sustainable Indonesia? We're here to help you get started.</p>
          <div style="margin-top: 3rem;">
            <p><i class="fas fa-envelope"></i> jelantahjenius@gmail.com</p>
            <p><i class="fas fa-phone"></i> Ajmarel - +62 821-2595-1038</p>
            <p><i class="fas fa-phone"></i> Marlie - +62 878-7600-1481</p>
            <p><i class="fas fa-map-marker-alt"></i> Bogor, Indonesia</p>
          </div>
          <div class="social-icons">
            <a href="https://www.instagram.com/jelantahjenius.id?igsh=MWRlN3AyMnAxbmt5bA==" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@jelantahjenius.id"><i class="fab fa-tiktok"></i></a>
          </div>
        </div>
        <div class="modern-form">
          <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="How can we help you today?" rows="5" required></textarea>
            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
